# Deploy Escalate MY to Alibaba Cloud OSS
# Secrets: ALIYUN_ACCESS_KEY_ID, ALIYUN_ACCESS_KEY_SECRET, ALIYUN_OSS_BUCKET, ALIYUN_OSS_ENDPOINT
# Optional: ALIYUN_CDN_DOMAIN

name: Deploy Escalate MY to Alibaba Cloud OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aliyun
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify dist output
        run: |
          test -f dist/index.html
          ls -la dist/

      - name: Install ossutil
        run: |
          curl -sL https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil64 -o ossutil
          chmod +x ossutil
          sudo mv ossutil /usr/local/bin/ossutil

      - name: Configure ossutil
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        run: |
          cat > /tmp/.ossutilconfig << EOF
          [Credentials]
          language=EN
          accessKeyID=${ALIYUN_ACCESS_KEY_ID}
          accessKeySecret=${ALIYUN_ACCESS_KEY_SECRET}
          endpoint=${ALIYUN_OSS_ENDPOINT}
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/.ossutilconfig

      - name: Sync dist to OSS
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          ossutil -c /tmp/.ossutilconfig sync dist/ "oss://${ALIYUN_OSS_BUCKET}/" \
            --delete --force --jobs 8 --update

      - name: Cache headers
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
        run: |
          ossutil -c /tmp/.ossutilconfig set-meta "oss://${ALIYUN_OSS_BUCKET}/" \
            Cache-Control:public,max-age=31536000,immutable -r -f \
            --include "*.js" --include "*.css" || true
          ossutil -c /tmp/.ossutilconfig set-meta "oss://${ALIYUN_OSS_BUCKET}/index.html" \
            Cache-Control:no-cache,no-store,must-revalidate -f || true

      - name: Summary
        env:
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        run: |
          echo "Escalate MY deployed to oss://${ALIYUN_OSS_BUCKET}/ (${ALIYUN_OSS_ENDPOINT})"
