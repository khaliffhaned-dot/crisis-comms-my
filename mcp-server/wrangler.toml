name = "escalate-my-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-02"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "escalate-my"
database_id = "D1_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "escalate-reports"

[[kv_namespaces]]
binding = "CACHE"
id = "KV_ID"
