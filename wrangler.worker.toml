name = "escalate-my-mcp"
main = "worker/src/index.ts"
compatibility_date = "2025-06-01"

[durable_objects]
bindings = [
  { name = "INCIDENT_ROOM", class_name = "IncidentRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IncidentRoom"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[[d1_databases]]
binding = "DB"
database_id = "5967539e-1748-4da6-9808-8f5084360d67"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "escalate-reports"
